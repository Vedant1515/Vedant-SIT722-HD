name: CD - Staging and Production

on:
  push:
    branches: ["testing", "main"]
  workflow_dispatch: {}

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          echo "${{ secrets.AKS_KUBECONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV
          kubectl version --client

      - name: Render manifests with image tags
        run: |
          sed -i "s#REPLACE_ACR#${{ secrets.ACR_LOGIN_SERVER }}#g" k8s/backend-deploy-blue.yaml k8s/backend-deploy-green.yaml k8s/frontend-deploy.yaml
          sed -i "s#REPLACE_TAG#${{ env.IMAGE_TAG }}#g" k8s/backend-deploy-blue.yaml k8s/backend-deploy-green.yaml k8s/frontend-deploy.yaml

      - name: Create namespaces
        run: |
          kubectl apply -f k8s/namespace-staging.yaml
          kubectl apply -f k8s/namespace-prod.yaml

      - name: Bootstrap secrets and configmaps
        run: |
          kubectl apply -f k8s/backend-config.yaml

          kubectl -n staging create secret generic newsapi-secret --from-literal=NEWSAPI_KEY="${{ secrets.NEWSAPI_KEY }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n prod    create secret generic newsapi-secret --from-literal=NEWSAPI_KEY="${{ secrets.NEWSAPI_KEY }}" --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n staging create secret generic azure-storage-secret \
            --from-literal=azurestorageaccountname="${{ secrets.STORAGE_ACCOUNT_NAME }}" \
            --from-literal=azurestorageaccountkey="${{ secrets.STORAGE_ACCOUNT_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n prod create secret generic azure-storage-secret \
            --from-literal=azurestorageaccountname="${{ secrets.STORAGE_ACCOUNT_NAME }}" \
            --from-literal=azurestorageaccountkey="${{ secrets.STORAGE_ACCOUNT_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify Azure File Shares
        run: |
          az storage share create \
            --name newsflow-staging \
            --account-name ${{ secrets.STORAGE_ACCOUNT_NAME }} \
            --account-key ${{ secrets.STORAGE_ACCOUNT_KEY }} \
            --output none 2>/dev/null || echo "newsflow-staging share ready"
          
          az storage share create \
            --name newsflow-prod \
            --account-name ${{ secrets.STORAGE_ACCOUNT_NAME }} \
            --account-key ${{ secrets.STORAGE_ACCOUNT_KEY }} \
            --output none 2>/dev/null || echo "newsflow-prod share ready"

      - name: Storage PV and PVC
        run: |
          kubectl -n staging scale deploy --all --replicas=0 --timeout=30s 2>/dev/null || true
          kubectl -n prod scale deploy --all --replicas=0 --timeout=30s 2>/dev/null || true
          
          sleep 15
          
          kubectl -n staging delete pods --all --grace-period=0 --force 2>/dev/null || true
          kubectl -n prod delete pods --all --grace-period=0 --force 2>/dev/null || true
          
          sleep 5
          
          kubectl -n staging delete pvc azurefile-pvc --ignore-not-found --force --grace-period=0 2>/dev/null || true
          kubectl -n prod delete pvc azurefile-pvc --ignore-not-found --force --grace-period=0 2>/dev/null || true
          
          sleep 5
          
          kubectl patch pv azurefile-pv-staging -p '{"spec":{"claimRef": null}}' 2>/dev/null || true
          kubectl patch pv azurefile-pv-prod -p '{"spec":{"claimRef": null}}' 2>/dev/null || true
          
          sleep 3
          
          kubectl apply -f k8s/storage-azurefile.yaml
          
          sleep 5
          
          kubectl -n staging wait --for=jsonpath='{.status.phase}'=Bound pvc/azurefile-pvc --timeout=60s || echo "WARNING: Staging PVC not bound"
          kubectl -n prod wait --for=jsonpath='{.status.phase}'=Bound pvc/azurefile-pvc --timeout=60s || echo "WARNING: Prod PVC not bound"

      - name: Deploy blue and green backends
        run: |
          kubectl apply -f k8s/backend-deploy-blue.yaml
          kubectl apply -f k8s/backend-deploy-green.yaml

      - name: Service and HPA
        run: |
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend-hpa.yaml

      - name: Frontend
        run: |
          kubectl apply -f k8s/frontend-deploy.yaml

      - name: Set color and wait
        run: |
          bash k8s/scripts/switch_color.sh staging blue
          kubectl -n staging rollout status deploy/backend-blue --timeout=300s
          kubectl -n staging rollout status deploy/frontend --timeout=300s

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash k8s/scripts/switch_color.sh prod green
            kubectl -n prod rollout status deploy/backend-green --timeout=300s
          else
            bash k8s/scripts/switch_color.sh prod blue
            kubectl -n prod rollout status deploy/backend-blue --timeout=300s
          fi
          kubectl -n prod rollout status deploy/frontend --timeout=300s

      - name: Show External IPs
        run: |
          echo "STAGING FRONTEND:"; kubectl -n staging get svc frontend-svc -o wide || true
          echo "PROD FRONTEND:";    kubectl -n prod    get svc frontend-svc -o wide || true