name: CD - Staging and Production

on:
  push:
    branches: ["testing", "main"]
  workflow_dispatch: {}

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          echo "${{ secrets.AKS_KUBECONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV
          kubectl version --client

      - name: Render manifests with image tags
        run: |
          sed -i "s#REPLACE_ACR#${{ secrets.ACR_LOGIN_SERVER }}#g" k8s/backend-deploy-blue.yaml k8s/backend-deploy-green.yaml k8s/frontend-deploy.yaml
          sed -i "s#REPLACE_TAG#${{ env.IMAGE_TAG }}#g" k8s/backend-deploy-blue.yaml k8s/backend-deploy-green.yaml k8s/frontend-deploy.yaml

      - name: Create namespaces
        run: |
          kubectl apply -f k8s/namespace-staging.yaml
          kubectl apply -f k8s/namespace-prod.yaml

      - name: Bootstrap secrets and configmaps
        run: |
          # Config (file contains both namespaces, apply once without -n)
          kubectl apply -f k8s/backend-config.yaml

          # NewsAPI secret (secrets are created imperatively per namespace)
          kubectl -n staging create secret generic newsapi-secret --from-literal=NEWSAPI_KEY="${{ secrets.NEWSAPI_KEY }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n prod    create secret generic newsapi-secret --from-literal=NEWSAPI_KEY="${{ secrets.NEWSAPI_KEY }}" --dry-run=client -o yaml | kubectl apply -f -

          # Azure Storage secret
          kubectl -n staging create secret generic azure-storage-secret \
            --from-literal=azurestorageaccountname="${{ secrets.STORAGE_ACCOUNT_NAME }}" \
            --from-literal=azurestorageaccountkey="${{ secrets.STORAGE_ACCOUNT_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n prod create secret generic azure-storage-secret \
            --from-literal=azurestorageaccountname="${{ secrets.STORAGE_ACCOUNT_NAME }}" \
            --from-literal=azurestorageaccountkey="${{ secrets.STORAGE_ACCOUNT_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Storage PV and PVC
        run: |
          echo "Scaling down deployments to release PVCs..."
          kubectl -n staging scale deploy backend-blue backend-green --replicas=0 --timeout=30s 2>/dev/null || true
          kubectl -n prod scale deploy backend-blue backend-green --replicas=0 --timeout=30s 2>/dev/null || true
          
          echo "Waiting for pods to terminate..."
          sleep 15
          
          echo "Deleting existing PVCs..."
          kubectl -n staging delete pvc azurefile-pvc --ignore-not-found --timeout=60s || true
          kubectl -n prod delete pvc azurefile-pvc --ignore-not-found --timeout=60s || true
          
          echo "Applying storage configuration..."
          kubectl apply -f k8s/storage-azurefile.yaml
          
          echo "Waiting for PVCs to bind..."
          kubectl -n staging wait --for=jsonpath='{.status.phase}'=Bound pvc/azurefile-pvc --timeout=90s || echo "Staging PVC binding check timed out"
          kubectl -n prod wait --for=jsonpath='{.status.phase}'=Bound pvc/azurefile-pvc --timeout=90s || echo "Prod PVC binding check timed out"
          
          echo "PVC status:"
          kubectl -n staging get pvc azurefile-pvc || true
          kubectl -n prod get pvc azurefile-pvc || true

      - name: Deploy blue and green backends
        run: |
          # Files contain both namespaces, apply once without -n
          kubectl apply -f k8s/backend-deploy-blue.yaml
          kubectl apply -f k8s/backend-deploy-green.yaml

      - name: Service and HPA
        run: |
          # Files contain both namespaces, apply once without -n
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend-hpa.yaml

      - name: Frontend
        run: |
          # File contains both namespaces, apply once without -n
          kubectl apply -f k8s/frontend-deploy.yaml

      - name: Set color and wait
        run: |
          # Staging always points to blue for soak
          bash k8s/scripts/switch_color.sh staging blue
          kubectl -n staging rollout status deploy/backend-blue --timeout=240s
          kubectl -n staging rollout status deploy/frontend --timeout=240s

          # For main branch, promote green in prod, else keep blue
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash k8s/scripts/switch_color.sh prod green
            kubectl -n prod rollout status deploy/backend-green --timeout=240s
          else
            bash k8s/scripts/switch_color.sh prod blue
            kubectl -n prod rollout status deploy/backend-blue --timeout=240s
          fi
          kubectl -n prod rollout status deploy/frontend --timeout=240s

      - name: Show External IPs
        run: |
          echo "STAGING FRONTEND:"; kubectl -n staging get svc frontend-svc -o wide || true
          echo "PROD FRONTEND:";    kubectl -n prod    get svc frontend-svc -o wide || true